  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: swap;\n  src: url(\"0ccf51f2-a80c-40b6-a4e0-3b4384daf835\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Rye';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"46958a44-f80f-4940-9354-2da39fc2acf0\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"05b99f9b-9333-4347-8568-5bcdb53b945f\"><\u002Fscript>\n<style>\nhtml,body{margin:0;padding:0;background:#3a362f}\nbody{font-family:'Barlow',system-ui,sans-serif;color:#201d19;-webkit-font-smoothing:antialiased}\na{color:#b0322a}a:hover{color:#8a241d}\ninput,select,button,textarea{font-family:inherit}\ninput:focus,select:focus{outline:2px solid #b0322a;outline-offset:1px}\nbutton{-webkit-tap-highlight-color:transparent}\nbutton:disabled{opacity:.42;pointer-events:none;box-shadow:none}\n#pdq-cam-view{width:100%;height:100%}\n#pdq-cam-view video{width:100%!important;height:100%!important;object-fit:cover}\n@keyframes pdqspin{to{transform:rotate(360deg)}}\n@keyframes pdqfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n@keyframes pdqpulse{0%,100%{opacity:.4}50%{opacity:1}}\n@media print{body{background:#fff}.pdq-app{display:none!important}#pdq-print{display:block!important}@page{margin:14mm}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100dvh;background:#3a362f;display:flex;flex-direction:column\">\n<div class=\"pdq-app\" style=\"width:100%;max-width:480px;margin:0 auto;background:#f5f3ee;display:flex;flex-direction:column;min-height:100dvh;box-shadow:0 0 44px rgba(0,0,0,.4);position:relative;box-sizing:border-box\">\n\n<!-- ===== TOP BAR ===== -->\n<div style=\"background:#23201a;color:#f2efe8;display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;z-index:60;min-height:56px;box-sizing:border-box\">\n  <div style=\"width:32px;height:32px;background:#b0322a;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;flex:none;letter-spacing:.5px\">TR<\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:3px;line-height:1;flex:1;min-width:0\">\n    <div style=\"font-family:'Rye',serif;font-size:14px;letter-spacing:1.5px;white-space:nowrap\">TRUCK RANCH<\u002Fdiv>\n    <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:2.6px;color:#b5ac97;white-space:nowrap\">PAINT &amp; BODY QUOTER<\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex;gap:8px\">\n      <button onclick=\"{{ goHistory }}\" style=\"background:none;border:1px solid #4a453c;border-radius:8px;color:#e8e2d2;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.6px;padding:0 12px;height:44px;cursor:pointer\">QUOTES<\u002Fbutton>\n      <button onclick=\"{{ goAdmin }}\" style=\"background:none;border:1px solid #4a453c;border-radius:8px;color:#e8e2d2;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12.5px;letter-spacing:1.6px;padding:0 12px;height:44px;cursor:pointer\">ADMIN<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showStep }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.6px;color:#d8d2c2;border:1px solid #4a453c;border-radius:6px;padding:6px 9px;white-space:nowrap\">{{ stepLabel }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ showClose }}\" hint-placeholder-val=\"{{ false }}\">\n    <button onclick=\"{{ onClose }}\" aria-label=\"Close\" style=\"width:44px;height:44px;background:none;border:1px solid #4a453c;border-radius:8px;color:#f2efe8;font-size:15px;cursor:pointer;flex:none\">✕<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<!-- ===== HOME ===== -->\n<sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n<div data-screen-label=\"Home\" style=\"flex:1;display:flex;flex-direction:column;padding:18px 16px 20px;gap:13px;animation:pdqfade .25s ease\">\n  <sc-if value=\"{{ hasDraft }}\" hint-placeholder-val=\"{{ false }}\">\n    <button onclick=\"{{ onResumeDraft }}\" style=\"text-align:left;background:#fbf1d3;border:1.5px solid #ddb64d;border-left:5px solid #c79a1d;border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:1.8px;color:#7a5c10\">RESUME DRAFT<\u002Fspan>\n      <span style=\"font-weight:600;font-size:16px;color:#201d19\">{{ draftTitle }}<\u002Fspan>\n      <span style=\"font-size:12.5px;color:#857d70\">{{ draftSub }}<\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-if>\n  <button onclick=\"{{ onScan }}\" style=\"background:#b0322a;border:none;border-radius:14px;color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:5px;align-items:center;cursor:pointer;box-shadow:0 3px 0 #8a241d\" style-active=\"transform:translateY(2px);box-shadow:0 1px 0 #8a241d\">\n    <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:25px;letter-spacing:2px\">SCAN A VIN<\u002Fspan>\n    <span style=\"font-size:13.5px;color:#f3d2cf\">Start a new damage quote<\u002Fspan>\n  <\u002Fbutton>\n  <button onclick=\"{{ onManual }}\" style=\"background:#fff;border:1.5px solid #d9d2c4;border-radius:12px;padding:14px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16.5px;letter-spacing:1.4px;color:#201d19;cursor:pointer\">TYPE A VIN INSTEAD<\u002Fbutton>\n\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;margin-top:8px\">\n    <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:2.2px;color:#857d70\">RECENT QUOTES<\u002Fdiv>\n    <button onclick=\"{{ goHistory }}\" style=\"background:none;border:none;color:#b0322a;font-weight:600;font-size:13px;cursor:pointer;padding:6px 0\">All quotes ({{ histCount }}) →<\u002Fbutton>\n  <\u002Fdiv>\n  <sc-if value=\"{{ histEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"border:1.5px dashed #d9d2c4;border-radius:12px;padding:24px 16px;text-align:center;color:#857d70;font-size:14px\">No quotes yet — scan your first truck.<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-for list=\"{{ recents }}\" as=\"q\" hint-placeholder-count=\"2\">\n    <button onclick=\"{{ q.onOpen }}\" style=\"background:#fff;border:1px solid #e6dfd2;border-left:4px solid #2e7d46;border-radius:12px;display:flex;align-items:center;gap:12px;padding:13px 14px;text-align:left;cursor:pointer\">\n      <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-weight:600;font-size:15.5px;color:#201d19;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ q.title }}<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;color:#857d70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ q.sub }}<\u002Fspan>\n      <\u002Fspan>\n      <span style=\"text-align:right;display:flex;flex-direction:column;gap:2px;flex:none\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;color:#201d19\">{{ q.amount }}<\u002Fspan>\n        <span style=\"font-size:11.5px;color:#857d70\">{{ q.hrs }}<\u002Fspan>\n      <\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fsc-for>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <button onclick=\"{{ onDemo }}\" style=\"background:none;border:none;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#857d70;text-decoration:underline;cursor:pointer;padding:10px\">Demo: load a sample quote →<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== SCAN ===== -->\n<sc-if value=\"{{ isScan }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Scan VIN\" style=\"flex:1;display:flex;flex-direction:column;animation:pdqfade .25s ease\">\n  <div style=\"position:relative;background:#141210;height:44vh;min-height:290px;overflow:hidden;flex:none\">\n    <div id=\"pdq-cam-view\" style=\"position:absolute;inset:0\"><\u002Fdiv>\n    <sc-if value=\"{{ camOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none\">\n        <div style=\"width:78%;height:128px;border:2.5px solid rgba(255,255,255,.9);border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.34);display:flex;align-items:flex-end;justify-content:center\">\n          <span style=\"transform:translateY(30px);background:rgba(20,18,16,.75);color:#f2efe8;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:2px;padding:5px 10px;border-radius:6px\">ALIGN VIN BARCODE · CODE 39 / QR<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ onTorch }}\" style=\"position:absolute;top:12px;right:12px;background:rgba(20,18,16,.72);border:1.5px solid rgba(255,255,255,.4);border-radius:10px;color:#f2efe8;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.6px;padding:0 14px;height:44px;cursor:pointer\">{{ torchLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ camStarting }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;color:#b5ac97\">\n        <div style=\"width:26px;height:26px;border:3px solid #4a453c;border-top-color:#f2efe8;border-radius:50%;animation:pdqspin .8s linear infinite\"><\u002Fdiv>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:2px\">STARTING CAMERA…<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ camOff }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:20px;text-align:center\">\n        <button onclick=\"{{ onStartCam }}\" style=\"background:none;border:2px solid #f2efe8;border-radius:12px;color:#f2efe8;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:2px;padding:14px 26px;cursor:pointer\">START CAMERA<\u002Fbutton>\n        <span style=\"color:#857d70;font-size:13px\">or type the VIN below<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ camErr }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:24px;text-align:center\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;color:#e8a29c\">CAMERA UNAVAILABLE<\u002Fspan>\n        <span style=\"color:#b5ac97;font-size:13.5px;max-width:280px\">{{ camMsg }}<\u002Fspan>\n        <button onclick=\"{{ onStartCam }}\" style=\"background:none;border:1.5px solid #857d70;border-radius:10px;color:#e8e2d2;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:13px;letter-spacing:1.6px;padding:10px 18px;cursor:pointer;margin-top:4px\">TRY AGAIN<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ scanMsgOn }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:center\">\n        <span style=\"background:#fbf1d3;border:1.5px solid #ddb64d;color:#7a5c10;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px\">{{ scanMsg }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <div style=\"padding:16px;display:flex;flex-direction:column;gap:12px\">\n    <div style=\"background:#fff;border:1px solid #e6dfd2;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:2px;color:#857d70\">TYPE THE VIN<\u002Fspan>\n        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#857d70\">{{ vinCountDisp }}<\u002Fspan>\n      <\u002Fdiv>\n      <input value=\"{{ vinInput }}\" onchange=\"{{ onVinInput }}\" placeholder=\"17 characters — I, O, Q not allowed\" autocapitalize=\"characters\" autocorrect=\"off\" spellcheck=\"false\" style=\"width:100%;box-sizing:border-box;background:#f5f3ee;border:1.5px solid #d9d2c4;border-radius:10px;padding:13px 12px;font-family:'IBM Plex Mono',monospace;font-size:15.5px;letter-spacing:1.5px;color:#201d19\">\n      <sc-if value=\"{{ vinMsgOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12.5px;font-weight:600;color:{{ vinMsgColor }}\">{{ vinMsg }}<\u002Fdiv>\n      <\u002Fsc-if>\n      <button onclick=\"{{ onVinSubmit }}\" disabled=\"{{ vinSubmitDisabled }}\" style=\"background:#b0322a;border:none;border-radius:11px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:1.6px;padding:13px;cursor:pointer;box-shadow:0 2px 0 #8a241d\">DECODE VIN →<\u002Fbutton>\n      <sc-if value=\"{{ showOverride }}\" hint-placeholder-val=\"{{ false }}\">\n        <button onclick=\"{{ onVinOverride }}\" style=\"background:none;border:none;color:#7a5c10;font-size:12.5px;font-weight:600;text-decoration:underline;cursor:pointer;padding:4px\">Check digit failed — use this VIN anyway<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <div style=\"border:1.5px dashed #d9d2c4;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#857d70;line-height:1.45\">The VIN barcode is on the driver door-jamb sticker. A second plate sits at the base of the windshield.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== CONFIRM ===== -->\n<sc-if value=\"{{ isConfirm }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Confirm vehicle\" style=\"flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;animation:pdqfade .25s ease\">\n  <div style=\"background:#fff;border:1px solid #e6dfd2;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:8px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:center\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:2px;color:#857d70\">VIN<\u002Fspan>\n      <button onclick=\"{{ onRescan }}\" style=\"background:none;border:1.5px solid #d9d2c4;border-radius:8px;color:#201d19;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:1.4px;padding:7px 11px;cursor:pointer\">RESCAN<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:1.6px;word-break:break-all\">{{ vinDisp }}<\u002Fdiv>\n    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n      <sc-if value=\"{{ checkOkChip }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;border-radius:6px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:1.4px;color:#2e7d46;border:1.3px solid #9cc3a8;background:#eef5ef\">CHECK DIGIT OK<\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ overriddenChip }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;border-radius:6px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:1.4px;color:#7a5c10;border:1.3px solid #ddb64d;background:#fbf1d3\">CHECK DIGIT OVERRIDDEN<\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ decoding }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:1.4px;color:#857d70;border:1.3px solid #d9d2c4;background:#f5f3ee\"><span style=\"width:10px;height:10px;border:2px solid #d9d2c4;border-top-color:#857d70;border-radius:50%;animation:pdqspin .8s linear infinite;display:inline-block\"><\u002Fspan>DECODING VIA NHTSA…<\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ decodeOk }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;border-radius:6px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:1.4px;color:#2e7d46;border:1.3px solid #9cc3a8;background:#eef5ef\">NHTSA DECODE ✓<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ decodeFailed }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fbf1d3;border:1.5px solid #ddb64d;border-left:5px solid #c79a1d;border-radius:10px;padding:11px 13px;font-size:13.5px;color:#7a5c10;font-weight:500\">NHTSA decode failed — enter the truck manually below.<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"background:#fff;border:1px solid #e6dfd2;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n    <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:2px;color:#857d70\">VEHICLE — TAP TO CORRECT<\u002Fspan>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <label style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">YEAR<\u002Fspan><input value=\"{{ vYear }}\" onchange=\"{{ onYear }}\" inputmode=\"numeric\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-size:16px;color:#201d19\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">MAKE<\u002Fspan><input value=\"{{ vMake }}\" onchange=\"{{ onMake }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-size:16px;color:#201d19\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">MODEL<\u002Fspan><input value=\"{{ vModel }}\" onchange=\"{{ onModel }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-size:16px;color:#201d19\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">TRIM<\u002Fspan><input value=\"{{ vTrim }}\" onchange=\"{{ onTrim }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-size:16px;color:#201d19\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px;grid-column:1/-1\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">BODY CLASS<\u002Fspan><input value=\"{{ vBody }}\" onchange=\"{{ onBody }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-size:16px;color:#201d19\"><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#fff;border:1px solid #e6dfd2;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <label style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">STOCK #<\u002Fspan><input value=\"{{ stockNo }}\" onchange=\"{{ onStock }}\" placeholder=\"T-0000\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-family:'IBM Plex Mono',monospace;font-size:15px;color:#201d19\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:4px\"><span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">ESTIMATOR<\u002Fspan><input value=\"{{ estimator }}\" onchange=\"{{ onEst }}\" placeholder=\"Your name\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:10px;padding:11px 12px;font-size:16px;color:#201d19\"><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:space-between;align-items:center\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.6px;color:#857d70\">DATE<\u002Fspan>\n      <span style=\"display:inline-flex;gap:6px;align-items:center;border-radius:6px;padding:4px 9px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#201d19;border:1.3px solid #d9d2c4;background:#f5f3ee\">{{ dateDisp }}<span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.4px;color:#857d70\">AUTO<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"position:sticky;bottom:0;padding:10px 0 6px;background:linear-gradient(to top,#f5f3ee 65%,rgba(245,243,238,0))\">\n    <button onclick=\"{{ onConfirm }}\" disabled=\"{{ confirmDisabled }}\" style=\"width:100%;background:#b0322a;border:none;border-radius:13px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:1.8px;padding:16px;cursor:pointer;box-shadow:0 3px 0 #8a241d\" style-active=\"transform:translateY(2px);box-shadow:0 1px 0 #8a241d\">CONFIRM TRUCK →<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== PHOTOS ===== -->\n<sc-if value=\"{{ isPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Damage photos\" style=\"flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;animation:pdqfade .25s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <span style=\"font-weight:600;font-size:14.5px;color:#201d19\">{{ vehShort }}<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:#857d70\">{{ stockDisp }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"background:#eef2f8;border:1.5px solid #b8cbe4;border-left:5px solid #3a6fb0;border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:3px\">\n    <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.8px;color:#3a6fb0\">PHOTO TIPS<\u002Fspan>\n    <span style=\"font-size:13.5px;color:#2c4360;font-weight:500\">Stand 3–4 ft back · include the whole panel · avoid glare.<\u002Fspan>\n  <\u002Fdiv>\n  <input id=\"pdq-file-cam\" type=\"file\" accept=\"image/*\" capture=\"environment\" onchange=\"{{ onFiles }}\" style=\"display:none\">\n  <input id=\"pdq-file-lib\" type=\"file\" accept=\"image/*\" multiple=\"\" onchange=\"{{ onFiles }}\" style=\"display:none\">\n  <sc-if value=\"{{ roomLeft }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n      <label for=\"pdq-file-cam\" style=\"background:#b0322a;border-radius:12px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16.5px;letter-spacing:1.6px;padding:15px 8px;text-align:center;cursor:pointer;box-shadow:0 2px 0 #8a241d\">TAKE PHOTO<\u002Flabel>\n      <label for=\"pdq-file-lib\" style=\"background:#fff;border:1.5px solid #d9d2c4;border-radius:12px;color:#201d19;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16.5px;letter-spacing:1.6px;padding:15px 8px;text-align:center;cursor:pointer;box-sizing:border-box\">UPLOAD<\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ atMax }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"background:#fbf1d3;border:1.5px solid #ddb64d;border-radius:10px;padding:10px 13px;font-size:13px;color:#7a5c10;font-weight:500\">Max 10 photos per quote — delete one to add another.<\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n    <sc-for list=\"{{ photosView }}\" as=\"p\" hint-placeholder-count=\"0\">\n      <div style=\"position:relative\">\n        {{ p.thumbEl }}\n        <sc-if value=\"{{ p.showRemove }}\" hint-placeholder-val=\"{{ false }}\">\n          <button onclick=\"{{ p.onRemove }}\" aria-label=\"Remove photo\" style=\"position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;background:#23201a;color:#fff;border:2px solid #f5f3ee;font-size:13px;cursor:pointer\">✕<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ p.analyzed }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"position:absolute;left:5px;bottom:5px;background:rgba(35,32,26,.82);color:#bfe3c9;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.2px;padding:3px 6px;border-radius:5px\">ANALYZED ✓<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#857d70;text-align:center\">{{ photoCountDisp }}<\u002Fdiv>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"position:sticky;bottom:0;padding:10px 0 6px;background:linear-gradient(to top,#f5f3ee 65%,rgba(245,243,238,0))\">\n    <button onclick=\"{{ onAnalyze }}\" disabled=\"{{ analyzeDisabled }}\" style=\"width:100%;background:#b0322a;border:none;border-radius:13px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:1.8px;padding:16px;cursor:pointer;box-shadow:0 3px 0 #8a241d\" style-active=\"transform:translateY(2px);box-shadow:0 1px 0 #8a241d\">{{ analyzeLabel }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== PROCESSING ===== -->\n<sc-if value=\"{{ isProcessing }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"AI classification\" style=\"flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;animation:pdqfade .25s ease\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline\">\n    <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:1.6px;color:#201d19\">CLASSIFYING PHOTOS<\u002Fspan>\n    <span style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;color:#857d70\">{{ procCount }}<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"height:10px;background:#e8e2d4;border-radius:8px;overflow:hidden\"><div style=\"height:100%;background:#b0322a;border-radius:8px;transition:width .4s ease;width:{{ procPctW }}\"><\u002Fdiv><\u002Fdiv>\n  <sc-for list=\"{{ procLines }}\" as=\"l\" hint-placeholder-count=\"0\">\n    <div style=\"background:#fff;border:1px solid #e6dfd2;border-left:4px solid {{ l.stripe }};border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:11px\">\n      {{ l.thumbEl }}\n      <span style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:2px\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.8px;color:#201d19\">{{ l.title }}<\u002Fspan>\n        <span style=\"font-size:12.5px;color:#857d70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ l.sub }}<\u002Fspan>\n      <\u002Fspan>\n      <sc-if value=\"{{ l.isRun }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:18px;height:18px;border:2.5px solid #e8e2d4;border-top-color:#b0322a;border-radius:50%;animation:pdqspin .8s linear infinite;flex:none\"><\u002Fspan><\u002Fsc-if>\n      <sc-if value=\"{{ l.showChip }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"display:inline-flex;border-radius:6px;padding:3px 8px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:11px;letter-spacing:1.2px;white-space:nowrap;flex:none;{{ l.chipCss }}\">{{ l.chipText }}<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <div style=\"background:#fdfaf2;border:1.5px solid #e0d3a8;border-left:5px solid #977a2b;border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:3px\">\n    <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.8px;color:#977a2b\">CONSISTENCY LOCK<\u002Fspan>\n    <span style=\"font-size:13px;color:#5c5344;line-height:1.45\">The AI only classifies damage. Hours come from the shop's fixed rate table — the same classification always prices the same.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"position:sticky;bottom:0;padding:10px 0 6px;background:linear-gradient(to top,#f5f3ee 65%,rgba(245,243,238,0))\">\n    <button onclick=\"{{ onGoQuote }}\" disabled=\"{{ procNotDone }}\" style=\"width:100%;background:#b0322a;border:none;border-radius:13px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:1.8px;padding:16px;cursor:pointer;box-shadow:0 3px 0 #8a241d\">{{ procCta }}<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== QUOTE ===== -->\n<sc-if value=\"{{ isQuote }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Quote\" style=\"flex:1;display:flex;flex-direction:column;paddin rder-radius:12px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:1.4px;color:#201d19;cursor:pointer\">+ ADD MORE PHOTOS<\u002Fbutton>\n  <\u002Fsc-if>\n  <button onclick=\"{{ onNewQuote }}\" style=\"background:none;border:1.5px dashed #d9d2c4;border-radius:12px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;letter-spacing:1.4px;color:#857d70;cursor:pointer\">START A NEW QUOTE<\u002Fbutton>\n  <div style=\"height:2px\"><\u002Fdiv>\n\n  <div style=\"position:sticky;bottom:0;margin:0 -16px -16px;background:#23201a;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;z-index:40\">\n    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px\">\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:1px;color:#f2efe8;white-space:nowrap\">{{ totalHrs }} HR · {{ totalUsd }}<\u002Fspan>\n      <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:10px;letter-spacing:1.8px;color:#b5ac97\">RATE TABLE PRICING<\u002Fspan>\n    <\u002Fdiv>\n    <button onclick=\"{{ onCopy }}\" style=\"background:#b0322a;border:none;border-radius:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:1.4px;padding:0 16px;height:48px;cursor:pointer\">COPY<\u002Fbutton>\n    <button onclick=\"{{ onPrint }}\" style=\"background:none;border:1.5px solid #4a453c;border-radius:10px;color:#f2efe8;font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:14px;letter-spacing:1.4px;padding:0 16px;height:48px;cursor:pointer\">PDF<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== HISTORY ===== -->\n<sc-if value=\"{{ isHistory }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Quote history\" style=\"flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;animation:pdqfad   <div style=\"flex:1\"><\u002Fdiv>\n  <div style=\"position:sticky;bottom:0;padding:10px 0 6px;background:linear-gradient(to top,#f5f3ee 65%,rgba(245,243,238,0))\">\n    <button onclick=\"{{ onScan }}\" style=\"width:100%;background:#b0322a;border:none;border-radius:13px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:1.8px;padding:15px;cursor:pointer;box-shadow:0 3px 0 #8a241d\">+ NEW QUOTE<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ===== ADMIN ===== -->\n<sc-if value=\"{{ isAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Admin rate table\" style=\"flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;animation:pdqfade .25s ease\">\n  <sc-if value=\"{{ pinLocked }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:300px;width:100%;margin:0 auto;padding-bottom:40px\">\n      <div style=\"text-align:center;display:flex;flex-direction:column;gap:5px\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:19px;letter-spacing:2px;color:#201d19\">ADMIN — RATE TABLE<\u002Fspan>\n        <span style=\"font-size:13px;color:#857d70\">PIN required. Estimators can never edit hours.<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"text-align:center;font-family:'IBM Plex Mono',monospace;font-size:24px;letter-spacing:10px;color:#201d19\">{{ pinDots }}<\u002Fdiv>\n      <sc-if value=\"{{ pinErr }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"text-align:center;color:#b0322a;font-weight:600;font-size:13px\">Wrong PIN — try again<\u002Fdiv><\u002Fsc-if>\n      <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n        <sc-for list=\"{{ pinKeys }}\" as=\"k\" hint-placeholder-count=\"12\">\n          <button onclick=\"{{ k.onTap }}\" style=\"height:58px;background:#fff;border:1.5px solid #d9d2c4;border-radius:12px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;color:#201d19;cursor:pointer\" style-active=\"background:#efe9dc\">{{ k.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ adminOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"display:flex;border:1.5px solid #23201a;border-radius:11px;overflow:hidden\">\n      <sc-for list=\"{{ adminTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ t.onTap }}\" style=\"flex:1;padding:12px 2px;border:none;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:1.2px;{{ t.css }}\">{{ t.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ tabBody }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"font-size:12.5px;color:#857d70\">Body-repair hours per panel × severity. Same classification always uses these numbers.<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:6px;align-items:center\">\n        <span><\u002Fspan>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1.2px;color:#857d70;text-align:center\">MINOR<\u002Fspan>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1.2px;color:#857d70;text-align:center\">MOD<\u002Fspan>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1.2px;color:#857d70;text-align:center\">HEAVY<\u002Fspan>\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:1.2px;color:#857d70;text-align:center\">REPL<\u002Fspan>\n      <\u002Fdiv>\n      <sc-for list=\"{{ bodyRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:6px;align-items:center\">\n          <span style=\"font-size:13px;font-weight:600;color:#201d19\">{{ r.label }}<\u002Fspan>\n          <sc-for list=\"{{ r.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <input type=\"number\" step=\"0.1\" min=\"0\" inputmode=\"decimal\" value=\"{{ c.val }}\" onchange=\"{{ c.onChange }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:8px;padding:9px 4px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#201d19;text-align:center\">\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ tabPaint }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:12.5px;color:#857d70\">Refinish hours per panel. Blends add 50% of the adjacent panel; overlap deducts 0.4 hr per extra adjacent panel.<\u002Fdiv>\n      <sc-for list=\"{{ paintRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:1.8fr 1fr;gap:8px;align-items:center\">\n          <span style=\"font-size:13.5px;font-weight:600;color:#201d19\">{{ r.label }}<\u002Fspan>\n          <input type=\"number\" step=\"0.1\" min=\"0\" inputmode=\"decimal\" value=\"{{ r.val }}\" onchange=\"{{ r.onChange }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:8px;padding:10px 6px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#201d19;text-align:center\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ tabRI }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:12.5px;color:#857d70\">Remove &amp; install hours per part. Unlisted parts fall back to “Other”.<\u002Fdiv>\n      <sc-for list=\"{{ riRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n        <div style=\"display:grid;grid-template-columns:1.8fr 1fr;gap:8px;align-items:center\">\n          <span style=\"font-size:13.5px;font-weight:600;color:#201d19\">{{ r.label }}<\u002Fspan>\n          <input type=\"number\" step=\"0.1\" min=\"0\" inputmode=\"decimal\" value=\"{{ r.val }}\" onchange=\"{{ r.onChange }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:8px;padding:10px 6px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;color:#201d19;text-align:center\">\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ tabRates }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"font-size:12.5px;color:#857d70\">Labor $ per hour by category.<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e6dfd2;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px\">\n        <label style=\"display:grid;grid-template-columns:1.8fr 1fr;gap:8px;align-items:center\"><span style=\"font-size:14px;font-weight:600\">Body repair $/hr<\u002Fspan><input type=\"number\" step=\"1\" min=\"0\" inputmode=\"decimal\" value=\"{{ dB }}\" onchange=\"{{ onDB }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:8px;padding:10px 6px;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;color:#201d19\"><\u002Flabel>\n        <label style=\"display:grid;grid-template-columns:1.8fr 1fr;gap:8px;align-items:center\"><span style=\"font-size:14px;font-weight:600\">Paint refinish $/hr<\u002Fspan><input type=\"number\" step=\"1\" min=\"0\" inputmode=\"decimal\" value=\"{{ dP }}\" onchange=\"{{ onDP }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:8px;padding:10px 6px;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;color:#201d19\"><\u002Flabel>\n        <label style=\"display:grid;grid-template-columns:1.8fr 1fr;gap:8px;align-items:center\"><span style=\"font-size:14px;font-weight:600\">R&amp;I $/hr<\u002Fspan><input type=\"number\" step=\"1\" min=\"0\" inputmode=\"decimal\" value=\"{{ dR }}\" onchange=\"{{ onDR }}\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:8px;padding:10px 6px;font-family:'IBM Plex Mono',monospace;font-size:14px;text-align:center;color:#201d19\"><\u002Flabel>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e6dfd2;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px\">\n        <span style=\"font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:2px;color:#857d70\">CHANGE ADMIN PIN<\u002Fspan>\n        <div style=\"display:grid;grid-template-columns:1fr auto;gap:8px\">\n          <input value=\"{{ newPin }}\" onchange=\"{{ onNewPin }}\" inputmode=\"numeric\" placeholder=\"New 4-digit PIN\" style=\"width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #d9d2c4;border-radius:9px;padding:11px 12px;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:4px;color:#201d19\">\n          <button onclick=\"{{ onSavePin }}\" disabled=\"{{ savePinDisabled }}\" style=\"background:#23201a;border:none;border-radius:9px;color:#f2efe8;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:1.4px;padding:0 16px;cursor:pointer;min-height:48px\">SAVE PIN<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button onclick=\"{{ onReset }}\" style=\"background:#fff;border:1.5px solid #d99b96;border-radius:11px;padding:13px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;letter-spacing:1.6px;color:#b0322a;cursor:pointer\">{{ resetLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"position:sticky;bottom:0;padding:10px 0 6px;background:linear-gradient(to top,#f5f3ee 65%,rgba(245,243,238,0))\">\n      <button onclick=\"{{ onLockExit }}\" style=\"width:100%;background:#23201a;border:none;border-radius:13px;color:#f2efe8;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:1.8px;padding:15px;cursor:pointer\">LOCK &amp; EXIT<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- toast -->\n<sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#23201a;color:#f2efe8;font-size:13.5px;font-weight:500;padding:10px 18px;border-radius:22px;z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.3)\">{{ toast }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ===== PRINT SHEET ===== -->\n<div id=\"pdq-print\" style=\"display:none;background:#fff;color:#1a1a1a;font-family:'Barlow',sans-serif;padding:24px 8px;max-width:720px;margin:0 auto\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1a1a1a;padding-bottom:12px\">\n    <div>\n      <div style=\"font-family:'Rye',serif;font-size:24px;letter-spacing:2px\">TRUCK RANCH<\u002Fdiv>\n      <div style=\"font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:12px;letter-spacing:3px;color:#6b6357\">PAINT &amp; BODY QUOTE<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"font-family:'IBM Plex Mono',monospace;font-size:12px;color:#6b6357\">{{ dateDisp }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;padding:14px 0;font-size:13px\">\n    <div><span style=\"color:#857d70\">Vehicle&nbsp;&nbsp;<\u002Fspan><strong>{{ vehTitle }}<\u002Fstrong><\u002Fdiv>\n    <div><span style=\"color:#857d70\">Stock #&nbsp;&nbsp;<\u002Fspan><strong style=\"font-family:'IBM Plex Mono',monospace\">{{ stockDisp }}<\u002Fstrong><\u002Fdiv>\n    <div><span style=\"color:#857d70\">VIN&nbsp;&nbsp;<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace\">{{ vinDisp }}<\u002Fspan><\u002Fdiv>\n    <div><span style=\"color:#857d70\">Estimator&nbsp;&nbsp;<\u002Fspan>{{ estDisp }}<\u002Fdiv>\n  <\u002Fdiv>\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:12.5px\">\n    <sc-raw-thead><sc-raw-tr>\n      <sc-raw-th style=\"text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.6px;color:#6b6357;border-bottom:1.5px solid #1a1a1a;padding:6px 4px\">#<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:left;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.6px;color:#6b6357;border-bottom:1.5px solid #1a1a1a;padding:6px 4px\">DAMAGE<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.6px;color:#6b6357;border-bottom:1.5px solid #1a1a1a;padding:6px 4px\">BODY<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.6px;color:#6b6357;border-bottom:1.5px solid #1a1a1a;padding:6px 4px\">PAINT<\u002Fsc-raw-th>\n      <sc-raw-th style=\"text-align:right;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;letter-spacing:1.6px;color:#6b6357;border-bottom:1.5px solid #1a1a1a;padding:6px 4px\">R&amp;I<\u002Fsc-raw-th>\n    <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-for list=\"{{ printLines }}\" as=\"pl\" hint-placeholder-count=\"0\">\n        <sc-raw-tr>\n          <sc-raw-td style=\"border-bottom:1px solid #ddd;padding:7px 4px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#857d70;vertical-align:top\">{{ pl.idx }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border-bottom:1px solid #ddd;padding:7px 4px\"><strong>{{ pl.title }}<\u002Fstrong><div style=\"font-size:11px;color:#6b6357\">{{ pl.sub }}<\u002Fdiv><\u002Fsc-raw-td>\n          <sc-raw-td style=\"border-bottom:1px solid #ddd;padding:7px 4px;text-align:right;font-family:'IBM Plex Mono',monospace\">{{ pl.hb }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border-bottom:1px solid #ddd;padding:7px 4px;text-align:right;font-family:'IBM Plex Mono',monospace\">{{ pl.hp }}<\u002Fsc-raw-td>\n          <sc-raw-td style=\"border-bottom:1px solid #ddd;padding:7px 4px;text-align:right;font-family:'IBM Plex Mono',monospace\">{{ pl.hri }}<\u002Fsc-raw-td>\n        <\u002Fsc-raw-tr>\n      <\u002Fsc-for>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <div style=\"display:flex;justify-content:flex-end;padding-top:12px\">\n    <div style=\"min-width:280px;display:flex;flex-direction:column;gap:5px;font-size:13px\">\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#6b6357\">Body repair — {{ bodyCalc }}<\u002Fspan><strong>{{ usdB }}<\u002Fstrong><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#6b6357\">Paint refinish — {{ paintCalc }}<\u002Fspan><strong>{{ usdP }}<\u002Fstrong><\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between\"><span style=\"color:#6b6357\">R&amp;I — {{ riCalc }}<\u002Fspan><strong>{{ usdRI }}<\u002Fstrong><\u002Fdiv>\n      <div style=\"border-top:1.5px solid #1a1a1a;margin-top:4px;padding-top:6px;display:flex;justify-content:space-between;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px\"><span>TOTAL {{ totalHrs }} HR<\u002Fspan><span>{{ totalUsd }}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ hasFlagged }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"margin-top:12px;font-size:12px;color:#7a5c10;background:#fbf1d3;border:1px solid #ddb64d;border-radius:6px;padding:8px 10px\">{{ flaggedNote }} — excluded from totals pending human review.<\u002Fdiv>\n  <\u002Fsc-if>\n  <div style=\"display:flex;gap:40px;margin-top:44px\">\n    <div style=\"flex:1;border-top:1px solid #1a1a1a;padding-top:5px;font-size:11px;color:#6b6357\">Estimator signature<\u002Fdiv>\n    <div style=\"flex:1;border-top:1px solid #1a1a1a;padding-top:5px;font-size:11px;color:#6b6357\">Manager approval<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:20px;font-size:10.5px;color:#857d70;line-height:1.5\">Damage classified by AI vision. Labor hours are looked up in Truck Ranch's fixed, admin-controlled rate table — identical classifications always produce identical hours.<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 412, &quot;height&quot;: 892}, &quot;aiModel&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;claude-haiku-4-5&quot;, &quot;claude-sonnet-4-5&quot;], &quot;default&quot;: &quot;claude-haiku-4-5&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;AI classification&quot;}, &quot;adminPin&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;5701&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Security&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.apiCache = {};\n    this.scanner = null;\n    this._lastMsg = 0;\n    this._busy = false;\n    this.LS_RATES = 'pdq_rates_v1'; this.LS_HIST = 'pdq_quotes_v1'; this.LS_DRAFT = 'pdq_draft_v1'; this.LS_EST = 'pdq_estimator_v1'; this.LS_PIN = 'pdq_pin_v1';\n    this.PANELS = ['front_bumper','grille','hood','left_fender','right_fender','left_front_flare','right_front_flare','left_front_door','right_front_door','left_rear_door','right_rear_door','left_cab_corner','right_cab_corner','left_bedside','right_bedside','left_rear_flare','right_rear_flare','rocker_panel','roof','tailgate','rear_bumper','mirror','unknown'];\n    this.PLABEL = {front_bumper:'Front bumper',grille:'Grille',hood:'Hood',left_fender:'L fender',right_fender:'R fender',left_front_door:'L front door',right_front_door:'R front door',left_rear_door:'L rear door',right_rear_door:'R rear door',left_cab_corner:'L cab corner',right_cab_corner:'R cab corner',left_bedside:'L bedside',right_bedside:'R bedside',left_front_flare:'L front flare',right_front_flare:'R front flare',left_rear_flare:'L rear flare',right_rear_flare:'R rear flare',rocker_panel:'Rocker panel',roof:'Roof',tailgate:'Tailgate',rear_bumper:'Rear bumper',mirror:'Mirror',unknown:'Unknown panel'};\n    this.DAMAGE = ['dent','crease','scratch','crack','rust','missing_part','paint_only'];\n    this.SEVS = ['minor','moderate','heavy','replace'];\n    this.PARTS = ['door_handle','mirror','molding','bumper_cover','headlamp','tail_lamp','grille','emblem','fender_liner','tailgate_handle','mudflap','step_bar','antenna','door_panel','wheel_flare','other'];\n    this.PARTIAL_FACTOR = 0.6;\n    this.ADJ = {front_bumper:['left_fender','right_fender'],grille:['hood'],hood:['left_fender','right_fender'],left_fender:['hood','left_front_door'],right_fender:['hood','right_front_door'],left_front_door:['left_fender','left_rear_door'],right_front_door:['right_fender','right_rear_door'],left_rear_door:['left_front_door','left_cab_corner'],right_rear_door:['right_front_door','right_cab_corner'],left_cab_corner:['left_rear_door','left_bedside'],right_cab_corner:['right_rear_door','right_bedside'],left_bedside:['left_cab_corner','tailgate'],right_bedside:['right_cab_corner','tailgate'],tailgate:['left_bedside','right_bedside'],rear_bumper:['left_bedside','right_bedside'],left_front_flare:['left_fender'],right_front_flare:['right_fender'],left_rear_flare:['left_bedside'],right_rear_flare:['right_bedside'],rocker_panel:[],roof:[],mirror:[],unknown:[]};\n    this.state = {\n      screen: 'home',\n      camStatus: 'off', camMsg: '', torch: false, scanMsg: '',\n      vinInput: '', vin: '', vinOverridden: false,\n      decoding: false, decodeOk: false, decodeFailed: false,\n      veh: {year:'',make:'',model:'',trim:'',body:''},\n      stockNo: '', estimator: '', dateISO: new Date().toISOString(),\n      photos: [], lines: [], procDone: false,\n      quoteId: null, savedAt: 0,\n      rates: this.defaultRates(), history: [], draft: null,\n      pin: '', pinErr: false, adminOk: false, adminTab: 'body', resetArmed: false,\n      toast: '', histFilter: '', delArm: null, readOnly: false, newPin: ''\n    };\n  }\n\n  componentDidMount() {\n    const rates = this.mergeRates(this.load(this.LS_RATES));\n    const history = this.load(this.LS_HIST) || [];\n    const draft = this.load(this.LS_DRAFT);\n    const estimator = this.load(this.LS_EST) || '';\n    this.setState({ rates, history, draft, estimator });\n  }\n  componentWillUnmount() { this.stopScanner(); }\n\n  /* ---------- storage ---------- */\n  save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }\n  load(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }\n\n  defaultRates() {\n    const b = {front_bumper:[1.0,2.0,3.5,1.5],grille:[0.5,1.0,1.5,0.5],hood:[1.5,3.0,5.5,1.0],left_fender:[1.2,2.8,4.5,1.5],right_fender:[1.2,2.8,4.5,1.5],left_front_door:[1.5,3.0,5.0,2.5],right_front_door:[1.5,3.0,5.0,2.5],left_rear_door:[1.5,3.0,5.0,2.5],right_rear_door:[1.5,3.0,5.0,2.5],left_cab_corner:[2.0,4.0,7.0,8.0],right_cab_corner:[2.0,4.0,7.0,8.0],left_bedside:[2.0,4.5,8.0,10.0],right_bedside:[2.0,4.5,8.0,10.0],rocker_panel:[1.5,3.5,6.0,7.0],roof:[2.0,4.5,8.0,12.0],tailgate:[1.2,2.5,4.5,1.0],rear_bumper:[0.8,1.5,2.5,1.0],mirror:[0.3,0.5,0.8,0.3],left_front_flare:[0.6,1.2,2.2,0.8],right_front_flare:[0.6,1.2,2.2,0.8],left_rear_flare:[0.6,1.2,2.2,0.8],right_rear_flare:[0.6,1.2,2.2,0.8],unknown:[0,0,0,0]};\n    const body = {};\n    for (const p of Object.keys(b)) body[p] = { minor: b[p][0], moderate: b[p][1], heavy: b[p][2], replace: b[p][3] };\n    const refinish = {front_bumper:2.5,grille:1.0,hood:3.0,left_fender:2.0,right_fender:2.0,left_front_door:2.5,right_front_door:2.5,left_rear_door:2.5,right_rear_door:2.5,left_cab_corner:1.5,right_cab_corner:1.5,left_bedside:3.5,right_bedside:3.5,rocker_panel:1.5,roof:3.5,tailgate:2.5,rear_bumper:2.0,mirror:1.0,left_front_flare:1.5,right_front_flare:1.5,left_rear_flare:1.5,right_rear_flare:1.5,unknown:0};\n    const ri = {door_handle:0.3,mirror:0.4,molding:0.3,bumper_cover:1.0,headlamp:0.4,tail_lamp:0.3,grille:0.5,emblem:0.2,fender_liner:0.3,tailgate_handle:0.3,mudflap:0.2,step_bar:0.5,antenna:0.2,door_panel:0.4,wheel_flare:0.4,other:0.3};\n    return { body, refinish, ri, dollars: { body: 75, paint: 80, ri: 65 } };\n  }\n  mergeRates(saved) {\n    const d = this.defaultRates();\n    if (!saved) return d;\n    const out = { body: {}, refinish: {}, ri: {}, dollars: { ...d.dollars, ...(saved.dollars || {}) } };\n    for (const p of this.PANELS) out.body[p] = { ...d.body[p], ...((saved.body || {})[p] || {}) };\n    for (const p of this.PANELS) out.refinish[p] = (saved.refinish || {})[p] != null ? saved.refinish[p] : d.refinish[p];\n    for (const p of this.PARTS) out.ri[p] = (saved.ri || {})[p] != null ? saved.ri[p] : d.ri[p];\n    return out;\n  }\n  rn(v) { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; }\n\n  /* ---------- VIN ---------- */\n  vinCheck(v) {\n    if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(v)) return { ok: false, format: false };\n    const map = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};\n    const w = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];\n    let s = 0;\n    for (let i = 0; i < 17; i++) { const c = v[i]; s += (c >= '0' && c <= '9' ? +c : map[c]) * w[i]; }\n    const r = s % 11;\n    return { ok: (r === 10 ? 'X' : String(r)) === v[8], format: true };\n  }\n\n  /* ---------- scanner ---------- */\n  startScanner(attempt) {\n    attempt = attempt || 0;\n    if (this.state.screen !== 'scan') return;\n    const el = document.getElementById('pdq-cam-view');\n    if (!el) { if (attempt < 20) setTimeout(() => this.startScanner(attempt + 1), 150); return; }\n    if (!window.Html5Qrcode) {\n      if (attempt < 20) { setTimeout(() => this.startScanner(attempt + 1), 300); }\n      else this.setState({ camStatus: 'err', camMsg: 'Barcode library failed to load. Type the VIN below.' });\n      return;\n    }\n    if (this.scanner) return;\n    const F = window.Html5QrcodeSupportedFormats;\n    const cfgC = F ? { verbose: false, formatsToSupport: [F.QR_CODE, F.CODE_39, F.CODE_128] } : { verbose: false };\n    let sc;\n    try { sc = new window.Html5Qrcode('pdq-cam-view', cfgC); } catch (e) { this.setState({ camStatus: 'err', camMsg: 'Scanner failed to start.' }); return; }\n    this.scanner = sc;\n    sc.start({ facingMode: 'environment' }, { fps: 10, qrbox: (w, h) => ({ width: Math.max(150, Math.floor(Math.min(340, w * 0.85))), height: 150 }) },\n      (txt) => this.onScanHit(txt), () => {})\n      .then(() => { if (this.state.screen === 'scan') this.setState({ camStatus: 'on' }); else this.stopScanner(); })\n      .catch((err) => {\n        this.scanner = null;\n        const m = String(err && (err.message || err));\n        let msg = 'Camera could not start. Type the VIN below.';\n        if (/permission|notallowed/i.test(m)) msg = 'Camera permission was denied. Allow camera access, or type the VIN below.';\n        if (/notfound|no camera/i.test(m)) msg = 'No camera found on this device. Type the VIN below.';\n        this.setState({ camStatus: 'err', camMsg: msg });\n      });\n  }\n  stopScanner() {\n    const s = this.scanner; this.scanner = null;\n    if (s) { try { s.stop().then(() => { try { s.clear(); } catch (e) {} }).catch(() => {}); } catch (e) {} }\n  }\n  toggleTorch() {\n    if (!this.scanner) return;\n    const on = !this.state.torch;\n    this.scanner.applyVideoConstraints({ advanced: [{ torch: on }] })\n      .then(() => this.setState({ torch: on }))\n      .catch(() => this.setState({ scanMsg: 'Flash not supported by this camera' }));\n  }\n  onScanHit(raw) {\n    if (this.state.screen !== 'scan') return;\n    const clean = String(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');\n    const m = clean.match(/[A-HJ-NPR-Z0-9]{17}/);\n    const now = Date.now();\n    if (!m) { if (now - this._lastMsg > 2500) { this._lastMsg = now; this.setState({ scanMsg: 'Code read, but no 17-character VIN inside it' }); } return; }\n    const vin = m[0];\n    if (!this.vinCheck(vin).ok) { if (now - this._lastMsg > 2500) { this._lastMsg = now; this.setState({ scanMsg: 'VIN failed its check digit — hold steadier, or type it' }); } return; }\n    this.acceptVin(vin, false);\n  }\n  acceptVin(vin, overridden) {\n    this.stopScanner();\n    this.setState({ vin, vinOverridden: !!overridden, screen: 'confirm', scanMsg: '', torch: false, camStatus: 'off', vinInput: '' });\n    this.decodeVin(vin);\n  }\n\n  /* ---------- NHTSA ---------- */\n  async decodeVin(vin) {\n    this.setState({ decoding: true, decodeOk: false, decodeFailed: false });\n    try {\n      const ctl = new AbortController();\n      const t = setTimeout(() => ctl.abort(), 9000);\n      const res = await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/' + encodeURIComponent(vin) + '?format=json', { signal: ctl.signal });\n      clearTimeout(t);\n      const j = await res.json();\n      const r = (j.Results && j.Results[0]) || {};\n      const tc = (s) => String(s || '').toLowerCase().replace(/(^|[\\s-])[a-z]/g, (c) => c.toUpperCase());\n      const veh = { year: r.ModelYear || '', make: tc(r.Make), model: r.Model || '', trim: r.Trim || '', body: r.BodyClass || '' };\n      if (this.state.vin !== vin) return;\n      if (!veh.year && !veh.make && !veh.model) throw new Error('empty');\n      this.setState({ decoding: false, decodeOk: true, veh });\n    } catch (e) {\n      if (this.state.vin !== vin) return;\n      this.setState({ decoding: false, decodeFailed: true });\n    }\n  }\n\n  /* ---------- nav ---------- */\n  go(screen, opts) {\n    opts = opts || {};\n    if (this.state.screen === 'scan' && screen !== 'scan') this.stopScanner();\n    const patch = { screen };\n    if (screen === 'scan') { patch.scanMsg = ''; patch.torch = false; patch.camStatus = opts.auto ? 'starting' : 'off'; }\n    this.setState(patch, () => { if (screen === 'scan' && opts.auto) setTimeout(() => this.startScanner(), 80); });\n  }\n  newQuote(toScan) {\n    this.stopScanner();\n    this.apiCache = {};\n    this.setState({\n      vin: '', vinInput: '', vinOverridden: false, decoding: false, decodeOk: false, decodeFailed: false,\n      veh: {year:'',make:'',model:'',trim:'',body:''}, stockNo: '', dateISO: new Date().toISOString(),\n      photos: [], lines: [], quoteId: null, procDone: false, savedAt: 0, delArm: null, readOnly: false,\n      screen: toScan ? 'scan' : 'home', camStatus: toScan ? 'starting' : 'off', torch: false, scanMsg: ''\n    }, () => { if (toScan) setTimeout(() => this.startScanner(), 80); });\n  }\n\n  /* ---------- photos ---------- */\n  roomLeft() { return 10 - (this.state.lines.length + this.state.photos.filter(p => !p.analyzed).length); }\n  async addFiles(ev) {\n    const list = ev.target.files ? [...ev.target.files] : [];\n    ev.target.value = '';\n    const files = list.slice(0, Math.max(0, this.roomLeft()));\n    if (list.length > files.length) this.showToast('Photo limit reached — 10 max per quote');\n    for (const f of files) {\n      try {\n        const big = await this.scaleImage(f, 1100, 0.82);\n        const thumb = await this.scaleImage(f, 340, 0.7);\n        const id = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);\n        this.apiCache[id] = big.split(',')[1];\n        this.setState(s => ({ photos: [...s.photos, { id, thumb, analyzed: false }] }));\n      } catch (e) { this.showToast('Could not read that image'); }\n    }\n  }\n  scaleImage(file, max, q) {\n    return new Promise((res, rej) => {\n      const fr = new FileReader();\n      fr.onload = () => {\n        const img = new Image();\n        img.onload = () => {\n          try {\n            const r = Math.min(1, max / Math.max(img.width, img.height));\n            const c = document.createElement('canvas');\n            c.width = Math.max(1, Math.round(img.width * r));\n            c.height = Math.max(1 ct or scuffed only\n- \"moderate\" = dent 3-12 inches, OR any visible crease, OR broken paint\n- \"heavy\" = dent over 12 inches, deep creases, buckled or torn metal, or misaligned panel gaps\n- \"replace\" = holes, tears, severe rust-through, or damage crossing structural lines\n\nLeft and right mean the VEHICLE's left and right (driver side is left on US trucks). If you cannot tell which side or which panel, use panel \"unknown\" with confidence \"low\" rather than guessing.\nSet \"paint_damaged\" true only if the finish is visibly broken, scratched through, cracked, or missing.\nSet \"blend_adjacent_recommended\" true when a refinish would end mid-panel or color-match risk is high (metallic or pearl paint, repair near a panel edge).\nList \"ri_parts_needed\" only for parts that must come off to repair or refinish properly.\nIf the photo is not a vehicle exterior, is too blurry or dark, or has heavy glare: panel \"unknown\", confidence \"low\", and say why in notes.\nNever estimate labor hours, cost, or repair time. Classification only.`;\n  }\n  parseCls(text) {\n    try {\n      let t = String(text).replace(/```[a-zA-Z]*/g, '').trim();\n      const a = t.indexOf('{'), b = t.lastIndexOf('}');\n      if (a < 0 || b < a) return null;\n      const o = JSON.parse(t.slice(a, b + 1));\n      const norm = (v) => String(v == null ? '' : v).toLowerCase().trim().replace(/[\\s-]+/g, '_');\n      const panel = this.PANELS.includes(norm(o.panel)) ? norm(o.panel) : 'unknown';\n      const damage = this.DAMAGE.includes(norm(o.damage_type)) ? norm(o.damage_type) : 'dent';\n      const sev = this.SEVS.includes(norm(o.severity)) ? norm(o.severity) : 'moderate';\n      const conf = ['high','medium','low'].includes(norm(o.confidence)) ? norm(o.confidence) : 'low';\n      const parts = Array.isArray(o.ri_parts_needed) ? o.ri_parts_needed.map(norm).filter(Boolean).slice(0, 6) : [];\n      return { panel, damage_type: damage, severity: sev, paint_damaged: !!o.paint_damaged, blend_adjacent_recommended: !!o.blend_adjacent_recommended, ri_parts_needed: parts, confidence: conf, notes: String(o.notes || '').slice(0, 220) };\n    } catch (e) { return null; }\n  }\n  setLine(id, patch) { this.setState(s => ({ lines: s.lines.map(l => l.id === id ? { ...l, ...patch } : l) })); }\n  async classifyLine(id) {\n    this.setLine(id, { status: 'running', errMsg: '' });\n    const img = this.apiCache[id];\n    if (!img) { this.setLine(id, { status: 'error', errMsg: 'Photo is no longer in memory — delete this line and retake it.' }); return; }\n    if (!(window.claude && window.claude.complete)) { this.setLine(id, { status: 'error', errMsg: 'AI is unavailable in this environment. Try the demo from Home.' }); return; }\n    try {\n      const out = await window.claude.complete({\n        model: this.props.aiModel != null ? this.props.aiModel : 'claude-haiku-4-5',\n        max_tokens: 700,\n        system: this.sysPrompt(),\n        messages: [{ role: 'user', content: [\n          { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: img } },\n          { type: 'text', text: 'Classify the damage in this photo. JSON only.' }\n        ] }]\n      });\n      const cls = this.parseCls(out);\n      if (!cls) { this.setLine(id, { status: 'done', cls: null, review: true, open: true, editing: false }); this.autosave(); return; }\n      const review = cls.confidence === 'low' || cls.panel === 'unknown';\n      this.setLine(id, { status: 'done', cls, review, open: review, editing: false });\n      this.autosave();\n    } catch (e) {\n      this.setLine(id, { status: 'error', errMsg: 'AI call failed: ' + String(e && e.message ? e.message : e).slice(0, 120) + ' — tap RE-RUN AI.' });\n    }\n  }\n  startAnalyze() {\n    if (this._busy) return;\n    const fresh = this.state.photos.filter(p => !p.analyzed);\n    if (!fresh.length) return;\n    const newLines = fresh.map(p => ({ id: p.id, thumb: p.thumb, status: 'queued', cls: null, review: false, manual: false, open: false, editing: false, errMsg: '' }));\n    this.setState(s => ({\n      lines: [...s.lines, ...newLines],\n      photos: s.photos.map(p => ({ ...p, analyzed: true })),\n      screen: 'processing', procDone: false\n    }), () => this.runQueue());\n  }\n  async runQueue() {\n    this._busy = true;\n    const ids = this.state.lines.filter(l => l.status === 'queued').map(l => l.id);\n    for (const id of ids) { await this.classifyLine(id); await new Promise(r => setTimeout(r, 350)); }\n    this._busy = false;\n    const qid = this.state.quoteId || ('q' + Date.now());\n    this.setState({ procDone: true, quoteId: qid }, () => {\n      this.autosave();\n      setTimeout(() => { if (this.state.screen === 'processing') this.setState({ screen: 'quote' }); }, 800);\n    });\n  }\n\n  /* ---------- hours math ---------- */\n  lineHours(cls, rates) {\n    if (!cls) return { b: 0, p: 0, ri: 0, blends: [], riList: [] };\n    const b = this.rn((rates.body[cls.panel] || {})[cls.severity]);\n    let p = 0; const blends = []; let partial = false;\n    if (cls.paint_damaged) {\n      p = this.rn(rates.refinish[cls.panel]);\n      if (cls.paint_partial && p > 0) { p = Math.round(p * this.PARTIAL_FACTOR * 10) / 10; partial = true; }\n      if (cls.blend_adjacent_recommended) {\n        for (const adj of (this.ADJ[cls.panel] || []).slice(0, 2)) {\n          const h = Math.round(this.rn(rates.refinish[adj]) * 0.5 * 10) / 10;\n          if (h > 0) { blends.push({ panel: adj, hrs: h }); p += h; }\n        }\n      }\n    }\n    let ri = 0; const riList = [];\n    for (const part of (cls.ri_parts_needed || [])) {\n      const h = rates.ri[part] != null ? this.rn(rates.ri[part]) : this.rn(rates.ri.other);\n      ri += h; riList.push({ part, hrs: h });\n    }\n    let riOverridden = false;\n    if (cls.ri_override != null && String(cls.ri_override) !== '') {\n      const ov = parseFloat(cls.ri_override);\n      if (isFinite(ov) && ov >= 0) { ri = ov; riOverridden = true; }\n    }\n    return { b, p, ri, blends, riList, riOverridden, partial };\n  }\n  sevRank(s) { return { minor: 1, moderate: 2, heavy: 3, replace: 4 }[s] || 0; }\n  billingMap() {\n    const map = {};\n    for (const l of this.state.lines) {\n      if (l.status !== 'done' || l.review || !l.cls) continue;\n      const p = l.cls.panel;\n      if (!map[p]) {\n        map[p] = { winner: l.id, sev: l.cls.severity, paint: !!l.cls.paint_damaged, blend: !!l.cls.blend_adjacent_recommended, parts: [...(l.cls.ri_parts_needed || [])], ri_override: (l.cls.ri_override != null ? l.cls.ri_override : null), partial: !!l.cls.paint_partial };\n      } else {\n        const m = map[p];\n        if (this.sevRank(l.cls.severity) > this.sevRank(m.sev)) { m.sev = l.cls.severity; m.winner = l.id; }\n        m.paint = m.paint || !!l.cls.paint_damaged;\n        m.blend = m.blend || !!l.cls.blend_adjacent_recommended;\n        m.partial = m.partial && !!l.cls.paint_partial;\n        if (l.cls.ri_override != null && String(l.cls.ri_override) !== '') m.ri_override = l.cls.ri_override;\n        for (const pt of (l.cls.ri_parts_needed || [])) if (!m.parts.includes(pt)) m.parts.push(pt);\n      }\n    }\n    return map;\n  }\n  billingCls(panel, m) { return { panel, severity: m.sev, paint_damaged: m.paint, blend_adjacent_recommended: m.blend, ri_parts_needed: m.parts, ri_override: m.ri_override, paint_partial: !!m.partial }; }\n  quoteTotals() {\n    const { lines, rates } = this.state;\n    const map = this.billingMap();\n    let B = 0, P = 0, RI = 0;\n    const painted = new Set();\n    for (const p of Object.keys(map)) {\n      const h = this.lineHours(this.billingCls(p, map[p]), rates);\n      B += h.b; P += h.p; RI += h.ri;\n      if (map[p].paint && p !== 'unknown') painted.add(p);\n    }\n    let pairs = 0; const arr = [...painted];\n    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {\n      if ((this.ADJ[arr[i]] || []).includes(arr[j]) || (this.ADJ[arr[j]] || []).includes(arr[i])) pairs++;\n    }\n    const overlap = Math.min(P, pairs * 0.4);\n    P = Math.max(0, P - overlap);\n    const r1 = (x) => Math.round(x * 10) / 10;\n    B = r1(B); P = r1(P); RI = r1(RI);\n    const d = this.state.rates.dollars;\n    const usdB = Math.round(B * this.rn(d.body)), usdP = Math.round(P * this.rn(d.paint)), usdRI = Math.round(RI * this.rn(d.ri));\n    return { B, P, RI, overlap: r1(overlap), hrs: r1(B + P + RI), usdB, usdP, usdRI, usd: usdB + usdP + usdRI,\n      flagged: lines.filter(l => l.status === 'done' && l.review).length,\n      errors: lines.filter(l => l.status === 'error').length };\n  }\n\n  /* ---------- quote persistence ---------- */\n  autosave() {\n    if (!this.state.quoteId) return;\n    const t = this.quoteTotals();\n    const entry = {\n      id: this.state.quoteId, ts: Date.now(), vin: this.state.vin, stock: this.state.stockNo,\n      veh: this.state.veh, estimator: this.state.estimator, dateISO: this.state.dateISO,\n      lines: this.state.lines.map(l => ({ id: l.id, thumb: l.thumb, status: l.status === 'running' || l.status === 'queued' ? 'done' : l.status, cls: l.cls, review: l.review, manual: l.manual, errMsg: l.errMsg || '' })),\n      totals: { hrs: t.hrs, usd: t.usd }\n    };\n    this.setState(s => {\n      const history = [entry, ...s.history.filter(h => h.id !== entry.id)].slice(0, 50);\n      this.save(this.LS_HIST, history);\n      return { history, savedAt: Date.now() };\n    });\n    try { localStorage.removeItem(this.LS_DRAFT); } catch (e) {}\n  }\n  saveDraft() {\n    const { vin, veh, stockNo, estimator } = this.state;\n    if (!vin && !veh.make && !veh.model) return;\n    const d = { vin, veh, stockNo, estimator, ts: Date.now() };\n    this.save(this.LS_DRAFT, d);\n    this.setState({ draft: d });\n  }\n  openQuote(h) {\n    this.stopScanner();\n    this.apiCache = {};\n    this.setState({\n      vin: h.vin || '', veh: h.veh || {year:'',make:'',model:'',trim:'',body:''}, stockNo: h.stock || '',\n      estim
